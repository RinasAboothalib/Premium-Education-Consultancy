<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Top Text Path (clockwise around center) -->
    <path id="top-arc-path" d="M 18,100 A 82,82 0 1,1 182,100" fill="none" />
    <!-- Bottom Text Path (clockwise around bottom) -->
    <path id="bottom-arc-path" d="M 174,106 A 76,76 0 0,1 26,106" fill="none" />
  </defs>

  <!-- Outer Deep Navy Circle -->
  <circle cx="100" cy="100" r="98" fill="#0D3559" />

  <!-- Outer White Concentric Ring -->
  <circle cx="100" cy="100" r="91" fill="none" stroke="#FFFFFF" stroke-width="1.8" />

  <!-- Inner White Framing Ring for Text -->
  <circle cx="100" cy="100" r="69" fill="none" stroke="#FFFFFF" stroke-width="1.8" />

  <!-- Side Accent Ring Dividers (Left and Right subtle arc marks) -->
  <path d="M 11,100 A 89,89 0 0,1 15,74" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 189,100 A 89,89 0 0,0 185,74" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 11,100 A 89,89 0 0,0 15,126" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 189,100 A 89,89 0 0,1 185,126" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />

  <!-- Circular Text: PREMIUM EDUCATION -->
  <text fill="#FFFFFF" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="14.5" font-weight="800" letter-spacing="2.8">
    <textPath href="#top-arc-path" startOffset="50%" text-anchor="middle">
      PREMIUM EDUCATION
    </textPath>
  </text>

  <!-- Circular Text: CONSULTANCY -->
  <text fill="#FFFFFF" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" letter-spacing="4.5">
    <textPath href="#bottom-arc-path" startOffset="50%" text-anchor="middle">
      CONSULTANCY
    </textPath>
  </text>

  <!-- Center White Medallion Disc -->
  <circle cx="100" cy="100" r="66" fill="#FFFFFF" />

  <!-- Dotted Beaded Ring inside White Medallion -->
  <circle cx="100" cy="100" r="60.5" fill="none" stroke="#0D3559" stroke-width="2.2" stroke-dasharray="1.5 5" stroke-linecap="round" />

  <!-- Inner Thin Border Line -->
  <circle cx="100" cy="100" r="54.5" fill="none" stroke="#0D3559" stroke-width="0.8" />

  <!-- Three Navy Five-Pointed Stars -->
  <!-- Center Star -->
  <polygon points="100,56 102.5,63.5 110.5,63.5 104,68.5 106.5,76 100,71.5 93.5,76 96,68.5 89.5,63.5 97.5,63.5" fill="#0D3559" />
  <!-- Left Star (arched angle) -->
  <g transform="translate(80, 64) rotate(-16)">
    <polygon points="0,-7.5 2,-2 7.5,-2 3,1.5 5,7 0,3.5 -5,7 -3,1.5 -7.5,-2 -2,-2" fill="#0D3559" />
  </g>
  <!-- Right Star (arched angle) -->
  <g transform="translate(120, 64) rotate(16)">
    <polygon points="0,-7.5 2,-2 7.5,-2 3,1.5 5,7 0,3.5 -5,7 -3,1.5 -7.5,-2 -2,-2" fill="#0D3559" />
  </g>

  <!-- Classical Greek Pediment & Column Emblem -->
  <!-- Triangular Pediment (Roof) -->
  <path d="M 75 96 L 100 87 L 125 96 Z" fill="#0D3559" />

  <!-- Architrave horizontal beam -->
  <rect x="74" y="97.5" width="52" height="3" fill="#0D3559" />

  <!-- Ionic Capital (Scroll Volutes) -->
  <!-- Left Scroll -->
  <path d="M 72 108 C 67 108 67 101 74 101 C 80 101 80 106 75 106 C 73 106 72 105 72 104" fill="none" stroke="#0D3559" stroke-width="3" stroke-linecap="round" />
  <!-- Right Scroll -->
  <path d="M 128 108 C 133 108 133 101 126 101 C 120 101 120 106 125 106 C 127 106 128 105 128 104" fill="none" stroke="#0D3559" stroke-width="3" stroke-linecap="round" />
  <!-- Capital connecting bar -->
  <rect x="75" y="103" width="50" height="4" rx="1.5" fill="#0D3559" />

  <!-- 3 Fluted Pillars -->
  <!-- Left Pillar -->
  <rect x="83.5" y="112" width="6.5" height="36" fill="#0D3559" />
  <!-- Center Pillar -->
  <rect x="96.75" y="112" width="6.5" height="36" fill="#0D3559" />
  <!-- Right Pillar -->
  <rect x="110" y="112" width="6.5" height="36" fill="#0D3559" />

  <!-- Pedestal Base Bars -->
  <rect x="79" y="148" width="42" height="3.5" fill="#0D3559" />
  <rect x="74" y="152" width="52" height="4" fill="#0D3559" />
  <line x1="68" y1="158" x2="132" y2="158" stroke="#0D3559" stroke-width="1.8" stroke-linecap="round" />
</svg>
